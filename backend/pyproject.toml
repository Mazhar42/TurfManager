[project]
name = "turfmanager-backend"
version = "0.1.0"
description = "Turf Manager API — bookings, customers, payments, pricing, reports"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "passlib[argon2]>=1.7.4",
    "python-multipart>=0.0.12",
    "email-validator>=2.2",
    "sentry-sdk[fastapi]>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI's Depends()/Query() pattern is a call-in-default by design.
# F821: ruff doesn't resolve SQLAlchemy's quoted forward refs inside Mapped["X"].
ignore = ["B008", "F821"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
