name: Deploy

# Manual only: Actions → Deploy → "Run workflow". Nothing reaches the server until you
# choose to, and the `production` environment can additionally require an approval.
#
# Flow: full CI → build & push images to GHCR tagged with the commit SHA → copy the compose
# file and deploy scripts to the VPS over SSH → deploy/deploy.sh pulls, migrates, restarts,
# waits for health → public smoke test of both domains.
#
# One-time setup (Settings → Secrets and variables → Actions), see DEPLOYMENT.md:
#   secrets:   VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS
#   variables: VPS_APP_DIR (default /opt/turfmanager), VPS_PORT (default 22),
#              DOMAIN, OWNER_DOMAIN (for the smoke test)
on:
  workflow_dispatch:
    inputs:
      publish_only:
        description: "Only build and push images (don't touch the server)"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish images
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: backend
            context: backend
            file: backend/Dockerfile
          - image: web
            context: .
            file: deploy/web/Dockerfile
          - image: backup
            context: deploy/backup
            file: deploy/backup/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/turfmanager-${{ matrix.image }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to VPS
    needs: publish
    if: ${{ !inputs.publish_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://${{ vars.DOMAIN }}
    permissions:
      contents: read
      packages: read
    env:
      APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/turfmanager' }}
      SSH_PORT: ${{ vars.VPS_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy configuration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          missing=""
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — see DEPLOYMENT.md, 'Connect GitHub to the server'."
            exit 1
          fi

      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_USER }}
            Port ${SSH_PORT}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Copy compose file and deploy scripts
        run: |
          # shellcheck disable=SC2029
          # ($APP_DIR is meant to expand on the runner, not the server.)
          ssh vps "mkdir -p '$APP_DIR/deploy'"
          scp docker-compose.yml .env.example "vps:$APP_DIR/"
          scp deploy/deploy.sh deploy/restore.sh "vps:$APP_DIR/deploy/"
          # shellcheck disable=SC2029
          ssh vps "chmod +x '$APP_DIR'/deploy/*.sh"

      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # shellcheck disable=SC2029
          # ($APP_DIR is meant to expand on the runner, not the server.)
          # Short-lived registry login: the job token can pull this repo's images and
          # expires with the job, so no long-lived registry credential lives on the server.
          printf '%s' "$GHCR_TOKEN" | ssh vps "docker login ghcr.io -u '${{ github.actor }}' --password-stdin" >/dev/null
          status=0
          # shellcheck disable=SC2029
          ssh vps "cd '$APP_DIR' && ./deploy/deploy.sh '${{ github.sha }}'" || status=$?
          ssh vps "docker logout ghcr.io" >/dev/null || true
          exit "$status"

      - name: Smoke test
        if: ${{ vars.DOMAIN != '' }}
        run: |
          for host in "${{ vars.DOMAIN }}" "${{ vars.OWNER_DOMAIN }}"; do
            [ -n "$host" ] || continue
            curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors "https://$host/health"
            echo "  <- https://$host/health"
            curl --fail --silent --show-error --output /dev/null "https://$host/"
            echo "  <- https://$host/ serves the app"
          done
